services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: node server.js
    volumes:
      - ./app:/app
      # Persist admin-uploaded gallery/board images across deploys
      - ./uploads:/app/data/uploads
    ports:
      - "127.0.0.1:3012:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      UPLOADS_DIR: /app/data/uploads
      DATABASE_URL: postgresql://flashpoint:${POSTGRES_PASSWORD}@db:5432/flashpoint_rentals
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flashpoint_rentals
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashpoint -d flashpoint_rentals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
