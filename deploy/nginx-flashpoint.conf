server {
    listen 80;
    server_name flashpointuiuc.com www.flashpointuiuc.com;
    return 301 https://flashpointuiuc.com$request_uri;
}

server {
    listen 80;
    server_name rentals.flashpointuiuc.com;
    return 301 https://rentals.flashpointuiuc.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flashpointuiuc.com www.flashpointuiuc.com;

    ssl_certificate /etc/letsencrypt/live/flashpointuiuc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flashpointuiuc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name rentals.flashpointuiuc.com;

    ssl_certificate /etc/letsencrypt/live/flashpointuiuc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flashpointuiuc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    server_name www.flashpointuiuc.com;

    ssl_certificate /etc/letsencrypt/live/flashpointuiuc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flashpointuiuc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://flashpointuiuc.com$request_uri;
}
