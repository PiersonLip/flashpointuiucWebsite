services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashpoint_dev}
      POSTGRES_DB: flashpoint_rentals
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashpoint -d flashpoint_rentals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
